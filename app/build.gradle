plugins {
    id "com.android.application"
}

android {
    namespace "com.lyracorp.metaforge"
    compileSdk 34

    defaultConfig {
        applicationId "com.lyracorp.metaforge"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl false
        buildConfig true
        renderScript false
    }
}

dependencies {
}
